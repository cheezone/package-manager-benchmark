<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>包管理器性能对比</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>包管理器性能对比</h1>
      <p class="sub">真实仓库夹具 · hyperfine 均值 ± 标准差 · 越低越好</p>
    </header>

    <div class="bar">
      <label>仓库</label>
      <div class="seg" id="fixture-seg"></div>
      <label>场景</label>
      <div class="seg" id="scenario-seg"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2 id="chart-title">—</h2>
        <span class="meta" id="chart-meta"></span>
      </div>
      <div id="chart" class="chart"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>数据表</h2>
        <label class="switch">
          <input type="checkbox" id="all-versions" />
          <span>显示多版本</span>
        </label>
      </div>
      <div class="table-wrap" id="table-wrap"></div>
    </div>

    <p class="foot" id="foot"></p>
  </div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
