name: Package Manager Benchmark

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Generate the matrix: for each PM, its last 3 minor-series releases.
  # ---------------------------------------------------------------------------
  setup:
    name: Generate matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: gen
        name: Compute last-3-versions matrix
        run: |
          MATRIX=$(node .github/scripts/matrix.mjs)
          {
            echo "matrix<<MATRIX_EOF"
            echo "$MATRIX"
            echo "MATRIX_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved matrix: $MATRIX"

  # ---------------------------------------------------------------------------
  # One job per (PM, version) combo. Times install/run with hyperfine.
  # ---------------------------------------------------------------------------
  benchmark:
    name: Bench ${{ matrix.pm }}@${{ matrix.version }}
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (pinned LTS 22)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install hyperfine (timing tool)
        run: |
          curl -fsSL https://github.com/sharkdp/hyperfine/releases/download/v1.20.0/hyperfine-v1.20.0-x86_64-unknown-linux-gnu.tar.gz -o /tmp/hf.tgz
          tar -xzf /tmp/hf.tgz -C /tmp
          echo "/tmp/hyperfine-v1.20.0-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
          hyperfine --version

      - name: Install package manager (${{ matrix.pm }}@${{ matrix.version }})
        run: bash .github/scripts/install-pm.sh ${{ matrix.pm }} ${{ matrix.version }}

      - name: Print versions
        run: bash .github/scripts/versions.sh ${{ matrix.pm }}

      - name: Run benchmark
        run: bash bench.sh ${{ matrix.pm }} ${{ matrix.version }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.pm }}-${{ matrix.version }}
          path: results/${{ matrix.pm }}-${{ matrix.version }}.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Merge every per-combo artifact and render the Markdown comparison table.
  # ---------------------------------------------------------------------------
  aggregate:
    name: Aggregate results
    needs: benchmark
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: all-results
          merge-multiple: true
      - name: Build comparison table
        run: node .github/scripts/aggregate.js all-results
