name: Package Manager Benchmark

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

# Matrix includes every fixture (synthetic + real-world repos) × PM × version.
# Regenerate with `node .github/scripts/matrix.mjs` and paste here.
jobs:
  benchmark:
    name: ${{ matrix.fixture }} · ${{ matrix.pm }}@${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- handle (antfu/handle @ 2003b777) ----
          - { fixture: handle,  pm: npm,  version: 11.19.1 }
          - { fixture: handle,  pm: npm,  version: 12.0.2 }
          - { fixture: handle,  pm: pnpm, version: 12.4.2 }
          - { fixture: handle,  pm: pnpm, version: 12.5.1 }
          - { fixture: handle,  pm: bun,  version: 1.3.14 }
          - { fixture: handle,  pm: bun,  version: 1.4.2 }
          - { fixture: handle,  pm: nub,  version: 0.8.3 }
          - { fixture: handle,  pm: nub,  version: 0.9.3 }
          - { fixture: handle,  pm: aube, version: 2.1.0 }
          - { fixture: handle,  pm: aube, version: 2.2.4 }
          # ---- vitesse (antfu-collective/vitesse @ 136a8b52, pre-catalog) ----
          - { fixture: vitesse, pm: npm,  version: 11.19.1 }
          - { fixture: vitesse, pm: npm,  version: 12.0.2 }
          - { fixture: vitesse, pm: pnpm, version: 12.4.2 }
          - { fixture: vitesse, pm: pnpm, version: 12.5.1 }
          - { fixture: vitesse, pm: bun,  version: 1.3.14 }
          - { fixture: vitesse, pm: bun,  version: 1.4.2 }
          - { fixture: vitesse, pm: nub,  version: 0.8.3 }
          - { fixture: vitesse, pm: nub,  version: 0.9.3 }
          - { fixture: vitesse, pm: aube, version: 2.1.0 }
          - { fixture: vitesse, pm: aube, version: 2.2.4 }
          # ---- synthetic monorepo ----
          - { fixture: synthetic, pm: npm,  version: 11.19.1 }
          - { fixture: synthetic, pm: npm,  version: 12.0.2 }
          - { fixture: synthetic, pm: pnpm, version: 12.4.2 }
          - { fixture: synthetic, pm: pnpm, version: 12.5.1 }
          - { fixture: synthetic, pm: bun,  version: 1.3.14 }
          - { fixture: synthetic, pm: bun,  version: 1.4.2 }
          - { fixture: synthetic, pm: nub,  version: 0.8.3 }
          - { fixture: synthetic, pm: nub,  version: 0.9.3 }
          - { fixture: synthetic, pm: aube, version: 2.1.0 }
          - { fixture: synthetic, pm: aube, version: 2.2.4 }
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (pinned LTS 22)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install hyperfine (timing tool)
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/sharkdp/hyperfine/releases/download/v1.20.0/hyperfine-v1.20.0-x86_64-unknown-linux-gnu.tar.gz -o /tmp/hf.tgz
          tar -xzf /tmp/hf.tgz -C /tmp
          HF_DIR="/tmp/hyperfine-v1.20.0-x86_64-unknown-linux-gnu"
          echo "$HF_DIR" >> "$GITHUB_PATH"
          "$HF_DIR/hyperfine" --version

      - name: Install package manager (${{ matrix.pm }}@${{ matrix.version }})
        run: bash .github/scripts/install-pm.sh ${{ matrix.pm }} ${{ matrix.version }}

      - name: Print versions
        run: bash .github/scripts/versions.sh ${{ matrix.pm }}

      - name: Run benchmark
        run: bash bench.sh ${{ matrix.pm }} ${{ matrix.version }} ${{ matrix.fixture }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.fixture }}-${{ matrix.pm }}-${{ matrix.version }}
          path: results/${{ matrix.fixture }}-${{ matrix.pm }}-${{ matrix.version }}.json
          if-no-files-found: warn

  aggregate:
    name: Aggregate results
    needs: benchmark
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: all-results
          merge-multiple: true
      - name: Build comparison table
        run: node .github/scripts/aggregate.js all-results
      - name: Build static site
        run: node .github/scripts/build-site.js results/aggregate.json site
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Upload results bundle
        uses: actions/upload-artifact@v4
        with:
          name: aggregate-bundle
          path: |
            results/aggregate.json
            results/LAST_RESULTS.md
            site/

  deploy:
    name: Deploy GitHub Pages
    needs: aggregate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
